name: Java CI Completo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      # 🔍 Verifica se o projeto compila (sem rodar testes ainda)
      - name: Verificar compilação
        run: ./gradlew assemble

      # 🧪 Executa testes
      - name: Rodar testes
        run: ./gradlew test

      # 📊 Gera relatório de testes (fica visível no GitHub)
      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/tests/test/

      # 🔎 Análise básica de código (lint)
      - name: Verificar qualidade do código
        run: ./gradlew check